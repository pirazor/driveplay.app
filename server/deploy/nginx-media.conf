# Reverse proxy for the media proxy, with HTTPS.
# 1. Replace api.driveplay.app with your subdomain.
# 2. Save as /etc/nginx/sites-available/api.driveplay.app and symlink into sites-enabled.
# 3. Get a cert:  sudo certbot --nginx -d api.driveplay.app
# 4. Reload:      sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.driveplay.app;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: don't buffer media; allow long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
